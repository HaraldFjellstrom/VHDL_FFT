name: Generate Hardware Verification Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install VHDL Simulator (nvc)
      run: |
        # Download the latest stable .deb package (v1.13.0 as of current stable)
        # We use -L to follow redirects and --output to name the file
        wget https://github.com/nickg/nvc/releases/download/r1.19.3/nvc_1.19.3-1_amd64_ubuntu-24.04.deb
        # Install the package and its dependencies
        sudo apt-get update
        sudo apt install -y ./nvc_1.19.3-1_amd64_ubuntu-24.04.deb
        # Verify installation
        nvc --version

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Execute Notebook
      run: |
        # 1. Add paths to Python so it can find the modules
        export PYTHONPATH=$PYTHONPATH:$(pwd)/notebooks:$(pwd)/sim

        # 2. Run papermill and tell it to act as if it's inside the 'notebooks' folder
        papermill $(pwd)/notebooks/Verification_Report.ipynb $(pwd)/executed_output.ipynb \
          -k python3 \
          --cwd notebooks

    - name: Convert to PDF
      run: |
        REPORT_NAME="vhdl_fft_verification_report_$(date +'%Y_%m_%d')"
        echo "FINAL_REPORT_NAME=$REPORT_NAME" >> $GITHUB_ENV

        # Create a temporary config file for adding header and footer
        cat <<EOF > jupyter_nbconvert_config.py
        c = get_config()
        c.WebPDFExporter.display_header_footer = True
        c.WebPDFExporter.header_template = '<div style="font-size: 10px; width: 100%; padding: 0 20px; display: flex; justify-content: space-between;"><span>Harald Fjellström</span><span><b>Design:</b> VHDL FFT Core</span><span>$(date +%Y-%m-%d)</span></div>'
        c.WebPDFExporter.footer_template = '<div style="font-size: 10px; width: 100%; text-align: right; padding-right: 20px;">Page <span class="pageNumber"></span> of <span class="totalPages"></span></div>'
        c.WebPDFExporter.margin_top = '1in'
        c.WebPDFExporter.margin_bottom = '1in'
        EOF

        jupyter nbconvert --to webpdf \
          --config jupyter_nbconvert_config.py \
          --TagRemovePreprocessor.remove_input_tags="['remove_input']" \
          --no-prompt \
          --allow-chromium-download \
          executed_output.ipynb --output "$REPORT_NAME"

    - name: Upload Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FINAL_REPORT_NAME }}
        path: ${{ env.FINAL_REPORT_NAME }}.pdf

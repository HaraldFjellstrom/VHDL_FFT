name: Generate Hardware Verification Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install VHDL Simulator (nvc)
      run: |
        # Download the latest stable .deb package (v1.13.0 as of current stable)
        # We use -L to follow redirects and --output to name the file
        wget https://github.com/nickg/nvc/releases/download/r1.19.3/nvc_1.19.3-1_amd64_ubuntu-24.04.deb
        # Install the package and its dependencies
        sudo apt-get update
        sudo apt install -y ./nvc_1.19.3-1_amd64_ubuntu-24.04.deb
        # Verify installation
        nvc --version

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Execute Notebook
      run: |
        # 1. Add paths to Python so it can find the modules
        export PYTHONPATH=$PYTHONPATH:$(pwd)/notebooks:$(pwd)/sim

        # This Python script modifies the notebook file in-place
        python3 -c "
        import nbformat as nbf
        from datetime import datetime
        # Use the exact filename from your repo
        path = 'notebooks/Verification_Report.ipynb'
        ntbk = nbf.read(path, as_version=4)
        # Create a professional header string
        header_content = (
            f'# Verification Report: VHDL FFT Core\n'
            f'**Designer:** Harald Fjellström | **Date:** {datetime.now().strftime(\"%Y-%m-%d\")}\n'
            f'---\n'
        )
        # Insert at the very top (index 0)
        ntbk.cells.insert(0, nbf.v4.new_markdown_cell(header_content))
        nbf.write(ntbk, path)
        "

        # 2. Run papermill and tell it to act as if it's inside the 'notebooks' folder
        papermill $(pwd)/notebooks/Verification_Report.ipynb $(pwd)/executed_output.ipynb \
          -k python3 \
          --cwd notebooks

    - name: Convert to PDF
      run: |
        REPORT_NAME="vhdl_fft_verification_report_$(date +'%Y_%m_%d')"
        echo "FINAL_REPORT_NAME=$REPORT_NAME" >> $GITHUB_ENV

        jupyter nbconvert --to webpdf \
          --TagRemovePreprocessor.remove_input_tags="['remove_input']" \
          --no-prompt \
          --allow-chromium-download \
          executed_output.ipynb --output "$REPORT_NAME"

    - name: Upload Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FINAL_REPORT_NAME }}
        path: ${{ env.FINAL_REPORT_NAME }}.pdf
